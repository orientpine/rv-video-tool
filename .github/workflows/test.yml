name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: leak scan (regex part; private name patterns stay on the maintainer's machine)
        run: RV_SCAN_PATTERNS=/dev/null bash scripts/scan-public.sh . || [ $? = 2 ]

  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-24.04
    # Linux runners are free on public repositories, so they get room for software rendering;
    # a private copy keeps the short limit because its minutes are billed.
    timeout-minutes: ${{ github.event.repository.private && 20 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every examples/<name>: script check and one still frame, no video render.
          - group: examples
            tests: examples
          # Measured on ubuntu-24.04 with software rendering: human 10 min, motion 19.7 min,
          # match 2 min; rv_best alone about 18 min and the layout check in new_checks
          # over 14 min, so those two run in groups of their own.
          - group: human
            tests: human human_act human_seat human_reach sao_numbers timeline_transition machine_collision timeline_captions
          - group: render
            tests: theme occlusion
          - group: rv_best
            tests: rv_best
          - group: motion
            tests: action_motion sharp layout_fixes check_error timeline_steps camera_action
          - group: checks
            tests: clearance_ext detach sfx_cue_skip rv_live_edit shot_parts camera_scene_cut pre_push gh_safe aspect quality
          - group: new_checks
            tests: new_checks
          - group: match
            tests: action_match actreverse_skip text_transition rv_parallel pop_framing text_motion
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: dependency cache key
        id: dependencies
        run: |
          echo "playwright=$(uv run -q --no-project --with playwright python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
          echo "uv-cache=$(uv cache dir)" >> "$GITHUB_OUTPUT"
      - name: cache Python dependencies and Chromium
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.dependencies.outputs.uv-cache }}
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-rv-playwright-${{ steps.dependencies.outputs.playwright }}-${{ hashFiles('scripts/test.sh') }}
      - name: system tools
        # apt reads the mirrors from /etc/apt/apt-mirrors.txt (azure.archive.ubuntu.com, then archive and security).
        # When the runner's resolver cannot answer these names, apt waits about 20 s for every file before the next
        # mirror; ffmpeg is about a hundred files, so the job sat here until it was cancelled. Drop the Azure entry
        # when it does not resolve or an attempt fails; map archive and security in /etc/hosts to the address a
        # public resolver gives (DNS over HTTPS to 1.1.1.1, no lookup needed) when the runner cannot resolve them;
        # try three times, with a limit on each attempt's index update and download; the install itself then runs
        # from the downloaded files.
        timeout-minutes: 10
        run: |
          packages=(ffmpeg fonts-noto-cjk)
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' |
            sudo tee /etc/apt/apt.conf.d/80rv-network > /dev/null
          if dpkg -s "${packages[@]}" > /dev/null 2>&1; then echo "already installed: ${packages[*]}"; exit 0; fi
          drop_azure() {
            if [ -f /etc/apt/apt-mirrors.txt ] && grep -q 'azure\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt; then
              echo "::warning::apt: $1; using the other mirrors in /etc/apt/apt-mirrors.txt"
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            fi
          }
          pin() {
            timeout 10 getent hosts "$1" > /dev/null && return 0
            ip=$(curl -fsS --max-time 10 -H 'accept: application/dns-json' "https://1.1.1.1/dns-query?name=$1&type=A" |
              jq -r '[.Answer[]? | select(.type == 1) | .data][0] // empty') || ip=
            if [ -n "$ip" ]; then
              echo "::warning::$1 does not resolve on this runner; /etc/hosts maps it to $ip (from 1.1.1.1)"
              echo "$ip $1" | sudo tee -a /etc/hosts > /dev/null
            else
              echo "::warning::$1 does not resolve on this runner or through 1.1.1.1"
            fi
          }
          timeout 10 getent hosts azure.archive.ubuntu.com > /dev/null ||
            drop_azure "azure.archive.ubuntu.com does not resolve"
          pin archive.ubuntu.com
          pin security.ubuntu.com
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update &&
              sudo timeout 240 apt-get install -y --download-only "${packages[@]}"; then
              exec sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${packages[@]}"
            fi
            drop_azure "attempt $attempt failed"
            sleep 10
          done
          exit 1
      - name: chromium
        # --with-deps runs apt-get as well; it uses the mirror list and timeouts set in the step above.
        timeout-minutes: 10
        run: uv run -q --no-project --with playwright python -m playwright install --with-deps chromium
      - name: software rendering
        run: |
          chrome="$(uv run -q --no-project --with playwright python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          printf '#!/bin/bash\nexec %q "$@" --disable-gpu --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader\n' "$chrome" > "$RUNNER_TEMP/chromium-software"
          chmod +x "$RUNNER_TEMP/chromium-software"
          echo "RV_CHROME=$RUNNER_TEMP/chromium-software" >> "$GITHUB_ENV"
      - name: tests
        run: |
          read -r -a tests <<< "$RV_TEST_NAMES"
          bash scripts/test.sh "${tests[@]}"
        env:
          RV_TEST_NAMES: ${{ matrix.tests }}
          RV_TEST_LOGS: ${{ runner.temp }}/rv-test-logs
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv-test-logs-${{ matrix.group }}
          path: ${{ runner.temp }}/rv-test-logs
